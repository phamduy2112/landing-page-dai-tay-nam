<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Accent Red Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FE0000" />
      <stop offset="100%" stop-color="#D40000" />
    </linearGradient>

    <!-- Accent Green Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2BC412" />
      <stop offset="100%" stop-color="#229E0E" />
    </linearGradient>

    <!-- Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" fill-opacity="0.06" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="600" fill="url(#bgGrad)" />
  <rect width="1920" height="600" fill="url(#gridPattern)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="220" fill="#FE0000" fill-opacity="0.22" filter="url(#glowRed)" />
  <circle cx="1720" cy="450" r="240" fill="#2BC412" fill-opacity="0.2" filter="url(#glowGreen)" />
  <circle cx="960" cy="50" r="160" fill="#FE0000" fill-opacity="0.12" filter="url(#glowRed)" />

  <!-- Stylized Decorative Waves / Curves -->
  <path d="M-100,520 C400,600 600,420 1000,490 C1400,560 1700,460 2020,530 L2020,600 L-100,600 Z" fill="#ffffff" fill-opacity="0.03" />
  <path d="M-100,550 C300,500 700,580 1200,520 C1600,470 1850,560 2020,540 L2020,600 L-100,600 Z" fill="#ffffff" fill-opacity="0.02" />

  <!-- Geometric Decorative Borders -->
  <rect x="30" y="30" width="1860" height="540" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" stroke-dasharray="10 10" />

  <!-- Left Side Badges: Korea & Taiwan Flags & Destinations -->
  <g transform="translate(140, 190)">
    <!-- Card 1: Korea -->
    <rect x="0" y="0" width="220" height="85" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#FE0000" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="25" y="42" font-family="'Montserrat', sans-serif" font-size="28" font-weight="900" fill="#ffffff">🇰🇷 HÀN QUỐC</text>
    <text x="25" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Visa D4-1 • D2 • TOPIK</text>

    <!-- Card 2: Taiwan -->
    <rect x="0" y="110" width="220" height="85" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#2BC412" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="25" y="152" font-family="'Montserrat', sans-serif" font-size="28" font-weight="900" fill="#ffffff">🇹🇼 ĐÀI LOAN</text>
    <text x="25" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Hệ 1+4 • VHVL • TOCFL</text>
  </g>

  <!-- Right Side Badges: Language Excellence -->
  <g transform="translate(1560, 190)">
    <!-- Card 3: Tiếng Hàn -->
    <rect x="0" y="0" width="220" height="85" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#FE0000" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="25" y="42" font-family="'Montserrat', sans-serif" font-size="24" font-weight="900" fill="#FE0000">TIẾNG HÀN</text>
    <text x="25" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Phản xạ chuẩn giọng Seoul</text>

    <!-- Card 4: Tiếng Trung -->
    <rect x="0" y="110" width="220" height="85" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#2BC412" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="25" y="152" font-family="'Montserrat', sans-serif" font-size="24" font-weight="900" fill="#2BC412">TIẾNG TRUNG</text>
    <text x="25" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Chữ Phồn Thể & Giao Tiếp</text>
  </g>

  <!-- Center Content: Main Updating Banner Notification -->
  <!-- Status Tag -->
  <g transform="translate(960, 160)" text-anchor="middle">
    <rect x="-160" y="-22" width="320" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
    <circle cx="-120" cy="0" r="6" fill="#FBBF24" />
    <text x="15" y="6" font-family="'Montserrat', sans-serif" font-size="14" font-weight="800" fill="#FBBF24" letter-spacing="1">ĐANG CẬP NHẬT HÌNH ẢNH BANNER</text>
  </g>

  <!-- Main Headline Title -->
  <text x="960" y="270" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    HỌC VIỆN ĐẠI TÂY NAM <tspan fill="#FE0000">EDU</tspan>
  </text>

  <!-- Subtitle -->
  <text x="960" y="335" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700" fill="#CBD5E1" letter-spacing="0.5">
    ĐÀO TẠO NGOẠI NGỮ <tspan fill="#FE0000">HÀN - TRUNG</tspan> • THỤ LÝ HỒ SƠ DU HỌC <tspan fill="#2BC412">HÀN - ĐÀI</tspan>
  </text>

  <!-- Notice Details -->
  <text x="960" y="395" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="500" fill="#94A3B8">
    Banner thiết kế nhận diện thương hiệu kỳ tuyển sinh 2026 đang được hoàn thiện và tải lên hệ thống.
  </text>

  <!-- Decorative Center Icon/Badge -->
  <g transform="translate(960, 460)" text-anchor="middle">
    <rect x="-190" y="-20" width="380" height="40" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="0" y="6" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">
      ✨ 50+ Trường ĐH Đối Tác  •  Cam Kết Visa 98.6%
    </text>
  </g>
</svg>
